# pnpm settings live here as of pnpm v11; the `pnpm` field in package.json
# is no longer read. This isn't a workspace in the multi-package sense —
# the file just doubles as the settings home.

# Native-build allowlist: pnpm refuses to run install scripts for packages
# not on this list (https://pnpm.io/settings#onlybuiltdependencies).
onlyBuiltDependencies:
  - esbuild

# Source-patched dependencies applied at install time.
patchedDependencies:
  '@storybook/addon-svelte-csf@5.1.2': patches/@storybook__addon-svelte-csf@5.1.2.patch

# Optional dependencies to skip. @parcel/watcher is only used by the sass
# CLI's --watch mode; Vite compiles SCSS through sass's JS API and never
# loads it. Skipping it drops micromatch and braces (GHSA-vfj7-8cjw-p6xm,
# no patched release) from the install.
ignoredOptionalDependencies:
  - '@parcel/watcher'

# Patched versions of transitive dependencies flagged by `pnpm audit`. Drop
# each once its parent requires a fixed release.
overrides:
  # vitest@3 pins tinypool@1 (GHSA-5gmw-xhrv-c9v3, GHSA-85c8-ppgw-ccpr). Goes
  # away with the Vitest 4 upgrade, which no longer uses tinypool.
  tinypool: ^2.1.2
  # Via postcss (GHSA-68fv-2mgg-jv7q).
  source-map-js: ^1.2.2
